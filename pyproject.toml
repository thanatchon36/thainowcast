[project]
name = "thainowcast"
version = "0.1.0"
description = "Pseudo-real-time nowcasting of Thai GDP and CPI with official and alternative data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.11",
    "statsmodels>=0.14.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
fetch = ["requests>=2.31", "pytrends>=4.9", "openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
thainowcast = "thainowcast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thainowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
